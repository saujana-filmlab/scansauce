name = "scansauce-content"
main = "src/index.js"
compatibility_date = "2026-08-27"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "saujana-content-media"

[vars]
# Leave this blank to serve media from scansauce.saujanalab.com/content/media/.
# Later this can become https://media.saujanalab.com.
PUBLIC_MEDIA_BASE_URL = ""
# Cloudflare Access is the outer gate. If populated, this is an extra allowlist
# for the authenticated email header that Access supplies.
ADMIN_EMAILS = ""
REQUIRE_ACCESS = "false"
